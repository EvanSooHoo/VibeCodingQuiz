<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Can You Spot the AI?</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      padding: 2rem;
      text-align: center;
    }
    .quiz-container {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .option {
      background: white;
      border: 1px solid #ccc;
      padding: 1rem;
      width: 300px;
      height: 200px;
      overflow-y: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    .choice-buttons {
      margin: 1rem;
      display: flex;
      gap: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .correct {
      color: green;
    }
    .incorrect {
      color: red;
    }
    #score {
      font-size: 1.2rem;
      margin-top: 2rem;
    }
    #restartBtn {
      margin-top: 1rem;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Can You Spot the AI?</h1>
    <p>Choose the text you think was written by a human.</p>
    <h3>Responding to prompt:</h3>
  </header>

  <div class="quiz-container">
    <div class="option" id="optionA">
      <strong>Option A:</strong>
      <p id="textA">Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
    </div>
    <div class="option" id="optionB">
      <strong>Option B:</strong>
      <p id="textB">Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
    </div>
  </div>

  <div class="choice-buttons">
    <button onclick="choose('A')">Choose A</button>
    <button onclick="choose('B')">Choose B</button>
  </div>

  <div id="result"></div>
  <div id="score" style="display: none;"></div>
  <button id="restartBtn" style="display: none;" onclick="restartQuiz()">Take Quiz Again</button>

  <div style="margin-top: 1rem;">
    <button onclick="nextQuestion()">Next Question</button>
  </div>

  <footer>
    <p>&copy; 2025 AI or Human Project</p>
  </footer>

  <script>
    const correctAnswers = ['A', 'A', 'B', 'B', 'A', 'B', 'A', 'B', 'A', 'A', 'B', 'B', 'B', 'A', 'B'];
    let currentQuestion = 0;
    let score = 0;

    function choose(choice) {
      const result = document.getElementById('result');
      const correct = correctAnswers[currentQuestion];
      if (choice === correct) {
        result.textContent = `Correct! Option ${correct} was human-written.`;
        result.className = 'correct';
        score++;
      } else {
        result.textContent = `Wrong! Option ${correct} was human-written.`;
        result.className = 'incorrect';
      }
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion >= correctAnswers.length) {
        showScore();
        return;
      }
      // Placeholder text logic; replace with real content as needed
      document.getElementById('textA').textContent = `Text A for Question ${currentQuestion + 1}`;
      document.getElementById('textB').textContent = `Text B for Question ${currentQuestion + 1}`;
      document.getElementById('result').textContent = '';
    }

    function showScore() {
      document.getElementById('quiz-container').style.display = 'none';
      document.getElementById('result').style.display = 'none';
      document.getElementById('score').style.display = 'block';
      document.getElementById('restartBtn').style.display = 'block';
      document.getElementById('score').textContent = `You got ${score} out of ${correctAnswers.length} correct.`;
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      document.getElementById('quiz-container').style.display = 'flex';
      document.getElementById('result').style.display = 'block';
      document.getElementById('score').style.display = 'none';
      document.getElementById('restartBtn').style.display = 'none';
      document.getElementById('textA').textContent = 'Text A for Question 1';
      document.getElementById('textB').textContent = 'Text B for Question 1';
      document.getElementById('result').textContent = '';
    }
  </script>
</body>
</html>
